<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage coupon list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">List management</p>
          <h1>Edit coupon list</h1>
        </div>
      </header>

      <main class="panel">
        <div id="status-box" class="meta-text"></div>

        <form id="manage-form">
          <label for="mode">Mode</label>
          <select id="mode" name="mode">
            <option value="sequential">Sequential</option>
            <option value="open">Open</option>
          </select>

          <label for="title">List title</label>
          <input id="title" name="title" type="text" maxlength="80" required />

          <label for="expiresAt">Expiry (optional)</label>
          <input id="expiresAt" name="expiresAt" type="datetime-local" />

          <label for="coupons">Coupons</label>
          <textarea id="coupons" name="coupons"></textarea>

          <div class="form-row" style="margin-top: 8px;">
            <button class="primary-button" type="submit">Save changes</button>
            <button class="secondary-button warn-button" type="button" id="delete-button">Delete list</button>
          </div>
        </form>

        <div id="error-box" class="error-box hidden"></div>
      </main>
    </div>

    <script src="/manage.js"></script>
  </body>
</html>
